openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: items
    description: ERP item code operations
  - name: reports
    description: Non-conformity report operations
  - name: rpa
    description: RPA bridge endpoints
  - name: storage
    description: Object storage upload and serving endpoints
  - name: users
    description: User account management (admin only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List ERP item codes
      description: Returns all available ERP item codes for use in report forms
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of item codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List ERP vendors (거래처 마스터)
      description: Returns vendors for submit form autocomplete. Searches vendor_cd, vendor_nm, and tax_no.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: includeInvalid
          in: query
          required: false
          schema:
            type: string
          description: "1 or true → also include valid_flg=false vendors"
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List non-conformity reports
      description: Returns a filtered, paginated list of non-conformity reports
      parameters:
        - name: defectType
          in: query
          required: false
          schema:
            type: string
        - name: syncStatus
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a non-conformity report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/stats:
    get:
      operationId: getReportStats
      tags: [reports]
      summary: Get report statistics
      description: Returns aggregate counts grouped by defect type and sync status for dashboard
      responses:
        "200":
          description: Report statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStats"

  /reports/pending:
    get:
      operationId: listPendingReports
      tags: [rpa]
      summary: List PENDING reports for RPA bot
      description: Returns all reports with PENDING sync status for the RPA bot to process
      responses:
        "200":
          description: List of pending reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    put:
      operationId: updateReport
      tags: [reports]
      summary: Update a non-conformity report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportBody"
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Report is locked (SLA expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a non-conformity report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Report deleted
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a single report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/{id}/sync-status:
    patch:
      operationId: updateReportSyncStatus
      tags: [rpa]
      summary: Update sync status of a report
      description: Used by the RPA bot to update the sync status after processing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSyncStatusBody"
      responses:
        "200":
          description: Sync status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/{id}/qc:
    put:
      operationId: updateReportQc
      tags: [reports]
      summary: QC 분석 결과 저장 (admin 전용)
      description: QC 담당자가 현장 분석 후 조치 결과를 저장한다. isLocked 보고서도 저장 가능. 원본 보고서 일부 필드(itemCode, flawTypeCd, lostManHours)도 함께 수정 가능.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcAnalysisBody"
      responses:
        "200":
          description: QC analysis saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/{id}/qc-action:
    post:
      operationId: submitQcAction
      tags: [reports]
      summary: QC 조치 결과 확정 (admin 전용)
      description: QC 담당자가 현장 확인 후 최종 조치 결과를 확정한다. 보고서가 isLocked인 경우에도 조치 가능.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcActionBody"
      responses:
        "200":
          description: QC action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /rpa/trigger:
    post:
      operationId: triggerRpa
      tags: [rpa]
      summary: Trigger RPA processing on all PENDING reports
      description: Simulates RPA bot execution - processes all PENDING reports and marks them COMPLETED or FAILED
      responses:
        "200":
          description: RPA run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpaRunResult"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /master/plants:
    get:
      operationId: listPlants
      tags: [items]
      summary: List plants
      responses:
        "200":
          description: List of plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantItem"

  /master/processes:
    get:
      operationId: listProcesses
      tags: [items]
      summary: List processes
      parameters:
        - name: plantCd
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessItem"

  /master/flaw-types:
    get:
      operationId: listFlawTypes
      tags: [items]
      summary: List flaw types
      responses:
        "200":
          description: List of flaw types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlawTypeItem"

  /master/departments:
    get:
      operationId: listDepartments
      tags: [items]
      summary: List departments
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentItem"

  /master/departments/{deptCd}:
    patch:
      operationId: updateDepartment
      tags: [items]
      summary: Update department webhook URL (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: deptCd
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentBody"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentItem"
        "404":
          description: Department not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user accounts
      description: Returns all user accounts. Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden (not admin or account inactive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account
      description: Creates a new user account. Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user account
      description: Admins can update any user. Non-admins can only update their own profile (role change excluded).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user account
      description: Permanently deletes a user account. Admin only. Cannot delete own account.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "400":
          description: Cannot delete own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password
      description: Sets a new password for the specified user. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 4
              required:
                - password
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}/active:
    patch:
      operationId: setUserActive
      tags: [users]
      summary: Activate or deactivate a user account
      description: Toggles the isActive status of a user account. Admin only. Cannot deactivate own account. Deactivated accounts cannot log in and existing tokens are immediately rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Cannot deactivate own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/login:
    post:
      operationId: login
      tags: [health]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/me:
    get:
      operationId: getMe
      tags: [health]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Item:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        category:
          type: string
      required:
        - id
        - code
        - name
        - category

    Vendor:
      type: object
      properties:
        vendorCd:
          type: string
        vendorNm:
          type: string
        taxNo:
          type: ["string", "null"]
          description: "사업자번호 (10자리)"
        validFlg:
          type: boolean
        syncedAt:
          type: string
          format: date-time
      required:
        - vendorCd
        - vendorNm
        - validFlg
        - syncedAt

    PlantItem:
      type: object
      properties:
        plantCd:
          type: string
        plantNm:
          type: string
      required:
        - plantCd
        - plantNm

    ProcessItem:
      type: object
      properties:
        plantCd:
          type: string
        processCd:
          type: string
        processNm:
          type: string
        laborCost:
          type: number
      required:
        - plantCd
        - processCd
        - processNm
        - laborCost

    FlawTypeItem:
      type: object
      properties:
        typeCd:
          type: string
        typeNm:
          type: string
        sortIndex:
          type: integer
      required:
        - typeCd
        - typeNm
        - sortIndex

    DepartmentItem:
      type: object
      properties:
        deptCd:
          type: string
        deptName:
          type: string
        isFrequent:
          type: boolean
        webhookUrl:
          type: ["string", "null"]
          description: "수산톡 부서 채널 Webhook URL"
      required:
        - deptCd
        - deptName
        - isFrequent

    Report:
      type: object
      properties:
        id:
          type: integer
        reportDate:
          type: string
          format: date-time
        itemCode:
          type: string
        modelName:
          type: ["string", "null"]
        processName:
          type: string
        defectType:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        syncStatus:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        registrantName:
          type: ["string", "null"]
        ncrType:
          type: ["string", "null"]
        factory:
          type: ["string", "null"]
        shipmentUnit:
          type: ["string", "null"]
        lostManHours:
          type: ["number", "null"]
        defectQty:
          type: ["integer", "null"]
        occurrenceDate:
          type: ["string", "null"]
          format: date-time
        issuingTeam:
          type: ["string", "null"]
        plantCd:
          type: ["string", "null"]
        processCd:
          type: ["string", "null"]
        flawTypeCd:
          type: ["string", "null"]
        deptCd:
          type: ["string", "null"]
        ncrGbnCd:
          type: ["string", "null"]
        vendorCd:
          type: ["string", "null"]
          description: "거래처 코드 (vendors.vendor_cd 또는 사업자번호)"
        vendorNm:
          type: ["string", "null"]
          description: "거래처명 (보고 시점 스냅샷)"
        productType:
          type: ["string", "null"]
          enum: ["양산", "개발", null]
          description: "양산 or 개발"
        labNotifiedAt:
          type: ["string", "null"]
          format: date-time
        ssushanTalkSentAt:
          type: ["string", "null"]
          format: date-time
        slaDeadlineAt:
          type: ["string", "null"]
          format: date-time
        isLocked:
          type: boolean
          description: "SLA 초과 시 true로 설정, 수정 불가"
        qcAction:
          type: ["string", "null"]
          description: "QC 최종 조치 결과"
        qcActionAt:
          type: ["string", "null"]
          format: date-time
        qcActionedBy:
          type: ["integer", "null"]
          description: "QC 조치 담당자 userId"
        qcStatus:
